<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cricket — Final Over</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@500;700&display=swap');
:root{--lime:#b8ff4a;--ink:#07130d;--cream:#f3f0df;--panel:#0d2418}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#07130d;color:var(--cream);font-family:'DM Sans',sans-serif;user-select:none}
button{font:inherit}.game{position:relative;width:100%;height:100%;min-height:560px;background:radial-gradient(circle at 50% 52%,#2d8f55 0,#17683a 38%,#09291b 72%,#06130d 100%);isolation:isolate}
.game:before{content:"";position:absolute;inset:0;opacity:.11;background-image:repeating-linear-gradient(90deg,transparent 0 9.7%,#fff 10%,transparent 10.3%);pointer-events:none}
.topbar{position:absolute;z-index:20;left:0;right:0;top:0;height:74px;display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:linear-gradient(180deg,rgba(5,18,12,.94),rgba(5,18,12,.25));border-bottom:1px solid rgba(255,255,255,.07)}
.brand{display:flex;align-items:center;gap:12px}.brandmark{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:var(--lime);color:var(--ink);font-family:'Barlow Condensed';font-size:25px;font-weight:800;transform:rotate(-12deg)}
.brandname{font-family:'Barlow Condensed';font-size:25px;line-height:.8;text-transform:uppercase;letter-spacing:1.5px}.brandname small{display:block;margin-top:7px;font-family:'DM Sans';font-size:9px;color:#9eb1a4;letter-spacing:3px}.scorecard{display:flex;align-items:center;gap:18px;text-align:right}.scorelabel{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:#99aa9f}.score{font-family:'Barlow Condensed';font-size:42px;font-weight:800;line-height:.85}.wickets{font-size:16px;color:#dfe7dc}.balls{display:flex;gap:5px}.balldot{width:18px;height:18px;border:1px solid rgba(255,255,255,.18);border-radius:50%;display:grid;place-items:center;font-size:9px;background:rgba(0,0,0,.12)}.balldot.done{background:var(--lime);color:var(--ink);border-color:var(--lime);font-weight:800}.balldot.wicket{background:#ff685e;color:white;border-color:#ff685e}
.stadium{position:absolute;left:50%;bottom:-8%;width:min(78vw,980px);height:82%;transform:translateX(-50%);perspective:900px}.pitch{position:absolute;left:50%;bottom:4%;width:31%;height:74%;transform:translateX(-50%) rotateX(62deg);transform-origin:50% 100%;background:linear-gradient(90deg,#d8c789 0 8%,#cdbb7b 8% 92%,#d8c789 92%);border:1px solid rgba(255,255,255,.35);box-shadow:0 25px 45px rgba(0,0,0,.28)}.pitch:before,.pitch:after{content:"";position:absolute;left:8%;right:8%;height:2px;background:rgba(255,255,255,.8)}.pitch:before{top:16%}.pitch:after{bottom:15%}.crease{position:absolute;left:10%;right:10%;height:4px;bottom:17%;background:white}.crease:before{content:"";position:absolute;left:-8%;right:-8%;height:2px;top:22px;background:white}.ring{position:absolute;left:50%;bottom:5%;width:72%;aspect-ratio:1.9;border:2px solid rgba(255,255,255,.42);border-radius:50%;transform:translateX(-50%);box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.fielder{position:absolute;width:11px;height:11px;border-radius:50%;background:#0a1711;border:2px solid #b8ff4a;box-shadow:0 3px 7px #07130d}.fielder:after{content:"";position:absolute;width:5px;height:8px;border-radius:4px;left:1px;top:9px;background:#e3bd91}.f1{left:15%;top:35%}.f2{right:16%;top:32%}.f3{left:30%;top:15%}.f4{right:29%;top:17%}.f5{left:8%;top:57%}.f6{right:8%;top:60%}
.batsman{position:absolute;z-index:9;left:50%;bottom:18%;width:74px;height:135px;transform:translateX(-50%);transition:transform .12s}.body{position:absolute;left:20px;bottom:35px;width:35px;height:58px;border-radius:12px 12px 8px 8px;background:#e8eee8;box-shadow:0 4px 12px rgba(0,0,0,.22)}.helmet{position:absolute;left:22px;bottom:91px;width:32px;height:32px;border-radius:50%;background:#153c25}.helmet:after{content:"";position:absolute;left:-4px;bottom:-3px;width:38px;height:12px;border-radius:8px;border-bottom:3px solid #87a18f}.leg{position:absolute;bottom:5px;width:13px;height:38px;border-radius:6px;background:#eef1e9}.leg.l{left:22px}.leg.r{right:22px}.glove{position:absolute;z-index:2;left:7px;bottom:76px;width:18px;height:13px;border-radius:50%;background:#d1d7c9}.bat{position:absolute;z-index:3;left:14px;bottom:36px;width:12px;height:112px;border-radius:5px 5px 3px 3px;background:linear-gradient(90deg,#d7ad65,#f2d28e 60%,#bd8d4b);transform-origin:50% 98%;transform:rotate(-42deg);box-shadow:3px 4px 6px rgba(0,0,0,.22)}.batsman.swing .bat{animation:swing .32s cubic-bezier(.2,.8,.2,1)}@keyframes swing{0%{transform:rotate(-42deg)}55%{transform:rotate(78deg)}100%{transform:rotate(-42deg)}}
.ball{position:absolute;z-index:12;width:13px;height:13px;border-radius:50%;background:#ff5d4e;box-shadow:0 3px 8px rgba(0,0,0,.35),inset -3px -2px 3px #a91e18;display:none}.ball.show{display:block}.trajectory{position:absolute;z-index:11;width:6px;height:6px;border-radius:50%;background:#dfe7dc;display:none}
.targetbox{position:absolute;z-index:21;left:28px;bottom:28px;width:230px;padding:15px 17px;border-radius:12px;background:rgba(6,22,14,.78);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(8px)}.targetlabel{font-size:9px;text-transform:uppercase;letter-spacing:2.2px;color:#9caf9f}.need{margin-top:3px;font-family:'Barlow Condensed';font-size:27px;font-weight:800}.need span{color:var(--lime)}
.controls{position:absolute;z-index:22;right:28px;bottom:28px}.shotbar{display:flex;align-items:center;gap:9px}.shotkey{height:68px;min-width:68px;border:1px solid rgba(255,255,255,.15);border-radius:12px;background:rgba(6,22,14,.82);color:white;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px);transition:.12s}.shotkey:hover{border-color:var(--lime);transform:translateY(-2px)}.shotkey.primary{width:92px;background:var(--lime);color:var(--ink);border:0;box-shadow:0 8px 24px rgba(184,255,74,.18)}.shotkey b{display:block;font-family:'Barlow Condensed';font-size:17px}.shotkey small{display:block;font-size:8px;text-transform:uppercase;letter-spacing:1px;margin-top:-10px;opacity:.7}.hint{position:absolute;z-index:21;left:50%;bottom:8px;transform:translateX(-50%);font-size:9px;color:rgba(255,255,255,.55);letter-spacing:2px;text-transform:uppercase}
.callout{position:absolute;z-index:30;left:50%;top:30%;transform:translate(-50%,-50%) scale(.7);font-family:'Barlow Condensed';font-size:92px;font-weight:800;color:white;text-shadow:0 8px 25px rgba(0,0,0,.45);opacity:0;pointer-events:none}.callout.pop{animation:pop .7s ease-out}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}
.overlay{position:absolute;z-index:50;inset:0;display:grid;place-items:center;background:rgba(4,17,10,.72);backdrop-filter:blur(10px);transition:.25s}.overlay.hidden{opacity:0;pointer-events:none}.modal{text-align:center;width:min(520px,calc(100% - 40px));padding:38px;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(8,31,19,.92);box-shadow:0 30px 80px rgba(0,0,0,.35)}.eyebrow{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--lime)}.modal h1{margin:8px 0 4px;font-family:'Barlow Condensed';font-size:64px;line-height:.95;text-transform:uppercase}.modal p{margin:12px auto 24px;color:#b6c5ba;max-width:390px;line-height:1.6}.start{border:0;border-radius:10px;background:var(--lime);color:var(--ink);font-family:'Barlow Condensed';font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:1px;padding:15px 28px;cursor:pointer}.start:hover{filter:brightness(1.05);transform:translateY(-1px)}
@media(max-width:700px){.topbar{height:64px;padding:10px 12px}.brandname{display:none}.brandmark{width:38px;height:38px}.scorecard{gap:8px}.score{font-size:32px}.balls{gap:3px}.balldot{width:15px;height:15px}.stadium{width:118vw;height:82%;bottom:-4%}.targetbox{left:10px;bottom:12px;width:155px;padding:10px}.need{font-size:20px}.controls{right:10px;bottom:12px}.shotbar{gap:5px}.shotkey{height:58px;min-width:58px}.shotkey.primary{width:72px}.hint{display:none}.callout{font-size:68px}.modal h1{font-size:48px}}
</style>
</head>
<body><main class="game" id="game">
<header class="topbar"><div class="brand"><div class="brandmark">C</div><div class="brandname">Cricket<small>FINAL OVER</small></div></div><div class="scorecard"><div><div class="scorelabel">Score</div><div><span class="score" id="score">42</span><span class="wickets"> / <span id="wickets">2</span></span></div></div><div><div class="scorelabel">This over</div><div class="balls" id="balls"></div></div></div></header>
<div class="stadium"><div class="ring"></div><div class="pitch"><div class="crease"></div></div><i class="fielder f1"></i><i class="fielder f2"></i><i class="fielder f3"></i><i class="fielder f4"></i><i class="fielder f5"></i><i class="fielder f6"></i><div class="ball" id="ball"></div><div class="batsman" id="batsman"><div class="helmet"></div><div class="body"></div><div class="leg l"></div><div class="leg r"></div><div class="glove"></div><div class="bat"></div></div></div>
<div class="targetbox"><div class="targetlabel">Target · 5 runs</div><div class="need"><span id="need">5</span> runs needed</div></div>
<div class="controls"><div class="shotbar"><button class="shotkey" data-shot="0"><div><b>A</b><small>Defend</small></div></button><button class="shotkey primary" id="hit"><div><b>HIT</b><small>Space</small></div></button><button class="shotkey" data-shot="2"><div><b>B</b><small>Attack</small></div></button></div></div>
<div class="hint">A / S / D to play · Swipe to hit</div><div class="callout" id="callout">FOUR!</div>
<div class="overlay" id="overlay"><div class="modal"><div class="eyebrow">Final over · 6 balls</div><h1 id="title">Need 5 to win</h1><p id="subtitle">Time your shot. Hit at the perfect moment to find the gaps and chase down the target.</p><button class="start" id="start">Start innings</button></div></div>
</main>
<script>
const $=s=>document.querySelector(s),game=$('#game'),batsman=$('#batsman'),ball=$('#ball'),scoreEl=$('#score'),wicketEl=$('#wickets'),needEl=$('#need'),callout=$('#callout'),overlay=$('#overlay'),ballsEl=$('#balls');
let score=42,wickets=2,balls=[],playing=false,anim=null,ballState=null,tx=0,ty=0,mode='wait',touchX=0,targetScore=47;
function renderBalls(){ballsEl.innerHTML='';for(let i=0;i<6;i++){const d=document.createElement('i');d.className='balldot';if(i<balls.length){d.textContent=balls[i]==='W'?'W':balls[i];d.classList.add('done');if(balls[i]==='W')d.classList.add('wicket')}ballsEl.appendChild(d)}}
renderBalls();
function showCall(text,cls=''){callout.textContent=text;callout.className='callout pop'+(cls?' '+cls:'');setTimeout(()=>callout.className='callout',700)}
function resetBall(){if(!playing)return;ball.className='ball show';batsman.className='batsman';mode='live';const start=performance.now(),duration=1550+Math.random()*350;const bowlerPos={x:game.clientWidth*.5,y:game.clientHeight*.18};const hitPos={x:game.clientWidth*.5,y:game.clientHeight*.78};ballState={start,duration,hit:false,speed:Math.random()};
function step(now){if(mode==='dead'||!playing)return;const p=Math.min(1,(now-start)/duration);const ease=p*p;tx=bowlerPos.x+(hitPos.x-bowlerPos.x)*ease;ty=bowlerPos.y+(hitPos.y-bowlerPos.y)*ease;const scale=.45+1.05*p;ball.style.left=(tx-game.offsetLeft-6)+'px';ball.style.top=(ty-6)+'px';ball.style.transform=`scale(${scale})`;if(p>=1){if(!ballState.hit){resolveMiss()}else mode='dead'}else anim=requestAnimationFrame(step)}anim=requestAnimationFrame(step)}
function hit(){if(!playing||mode!=='live'||ballState?.hit)return;if(!ballState)return;ballState.hit=true;const bowlerX=game.clientWidth*.5,batsmanX=game.clientWidth*.5;const d=Math.abs(tx-batsmanX)/game.clientWidth;const timing=1-Math.abs((performance.now()-ballState.start)/ballState.duration-.82);batsman.className='batsman swing';let runs=0;if(timing>.63&&d<.13)runs=Math.random()<.18?6:4;else if(timing>.3&&d<.22)runs=Math.random()<.35?2:1;else runs=0;
if(runs===0){showCall('MISS');resolveMiss(false)}else{ball.className='ball';showCall(runs===6?'SIX!':runs===4?'FOUR!':runs+' RUN',runs>=4?'big':'');score+=runs;scoreEl.textContent=score;balls.push(String(runs));renderBalls();mode='dead';needEl.textContent=Math.max(0,targetScore-score);setTimeout(nextOrEnd,850)}}
function resolveMiss(wicket=true){if(mode==='dead')return;mode='dead';ball.className='ball';let isWicket=wicket&&Math.random()<.32;if(!wicket)isWicket=false;if(isWicket){wickets++;wicketEl.textContent=wickets;balls.push('W');showCall('OUT')}else{balls.push('0');showCall('DOT')}renderBalls();needEl.textContent=Math.max(0,targetScore-score);setTimeout(nextOrEnd,850)}
function nextOrEnd(){if(score>=targetScore){end(true);return}if(wickets>=3||balls.length>=6){end(false);return}resetBall()}
function end(win){playing=false;ball.className='ball';overlay.classList.remove('hidden');$('#title').textContent=win?'You won the match!':'Match lost';$('#subtitle').textContent=win?`Clutch finish — ${score} runs on the board.`:`You needed ${targetScore-score} more with ${6-balls.length} balls remaining.`;$('#start').textContent='Play again'}
$('#hit').addEventListener('pointerdown',e=>{e.preventDefault();hit()});document.querySelectorAll('[data-shot]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();hit()}));
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.key.toLower=='a'||e.key.toLower=='s'||e.key.toLower=='d'){e.preventDefault();hit()}});
let sx=0,sy=0;game.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});game.addEventListener('pointerup',e=>{if(Math.abs(e.clientX-sx)>30||Math.abs(e.clientY-sy)>30)hit()});
function start(){score=42;wickets=2;balls=[];targetScore=47;scoreEl.textContent=score;wicketEl.textContent=wickets;needEl.textContent='5';renderBalls();overlay.classList.add('hidden');playing=true;setTimeout(resetBall,500)}$('#start').addEventListener('click',start);
</script></body></html>
